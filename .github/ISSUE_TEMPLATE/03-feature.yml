name: Feature request
description: Suggest an idea
labels: [feat]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What's missing or inconvenient?
      placeholder: "There's no way to ..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What should the feature look like?
      placeholder: "Add a ..."
    validations:
      required: true
